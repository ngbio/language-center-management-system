spring.application.name=language-center-management

# Load local secrets from .env when running from the backend directory.
# Real environment variables still take precedence over values in this file.
spring.config.import=optional:file:.env[.properties]

# MySQL
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# HikariCP
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# Multipart (same limits as the reference MVC project)
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=40MB

# CORS - override with APP_CORS_ALLOWED_ORIGINS in each environment
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# JWT (HS256 requires a secret of at least 32 bytes)
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# TODO: Add spring-boot-starter-mail and spring.mail.* only when email sending is implemented.
server.port=8081