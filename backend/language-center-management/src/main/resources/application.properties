spring.application.name=language-center-management

# Load local secrets from .env when running from the backend directory.
# Real environment variables still take precedence over values in this file.
spring.config.import=optional:file:.env[.properties]

# MySQL
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${HIBERNATE_FORMAT_SQL:false}
spring.jpa.open-in-view=false

# HikariCP
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# Multipart (same limits as the reference MVC project)
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=40MB

# Cloudinary image storage
cloudinary.url=${CLOUDINARY_URL:}
cloudinary.image.max-size-bytes=${CLOUDINARY_IMAGE_MAX_SIZE_BYTES:5242880}

# Firebase Realtime Database chat. Keep disabled until credentials are configured.
firebase.enabled=${FIREBASE_ENABLED:false}
firebase.database-url=${FIREBASE_DATABASE_URL:}
firebase.service-account-base64=${FIREBASE_SERVICE_ACCOUNT_JSON_BASE64:}

# CORS - override with APP_CORS_ALLOWED_ORIGINS in each environment
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
app.time-zone=${APP_TIME_ZONE:Asia/Ho_Chi_Minh}
app.notification.lesson-reminder-check-ms=${LESSON_REMINDER_CHECK_MS:60000}
app.notification.lesson-reminder-initial-delay-ms=${LESSON_REMINDER_INITIAL_DELAY_MS:15000}
app.notification.lesson-reminder-lookback-minutes=${LESSON_REMINDER_LOOKBACK_MINUTES:10}
app.notification.lesson-reminder-max-batches=${LESSON_REMINDER_MAX_BATCHES:20}

app.mail.enabled=${MAIL_ENABLED:false}
app.mail.provider=${MAIL_PROVIDER:smtp}
app.mail.from=${MAIL_FROM:${SPRING_MAIL_USERNAME:}}
app.mail.resend.api-key=${RESEND_API_KEY:}
app.mail.resend.base-url=${RESEND_BASE_URL:https://api.resend.com}
app.mail.student-batch-size=${MAIL_STUDENT_BATCH_SIZE:200}
app.mail.executor.core-pool-size=${MAIL_EXECUTOR_CORE_POOL_SIZE:2}
app.mail.executor.max-pool-size=${MAIL_EXECUTOR_MAX_POOL_SIZE:4}
app.mail.executor.queue-capacity=${MAIL_EXECUTOR_QUEUE_CAPACITY:100}
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_STARTTLS_ENABLE:true}
spring.mail.properties.mail.smtp.starttls.required=${SPRING_MAIL_STARTTLS_REQUIRED:true}
spring.mail.properties.mail.smtp.connectiontimeout=${SPRING_MAIL_CONNECTION_TIMEOUT:5000}
spring.mail.properties.mail.smtp.timeout=${SPRING_MAIL_TIMEOUT:10000}
spring.mail.properties.mail.smtp.writetimeout=${SPRING_MAIL_WRITE_TIMEOUT:10000}

# JWT (HS256 requires a secret of at least 32 bytes)
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

server.address=${SERVER_ADDRESS:0.0.0.0}
server.port=${PORT:8081}
invoice.pdf.font-path=${INVOICE_PDF_FONT_PATH:}

# Payment sandbox credentials are loaded from backend/.env.
payment.momo.endpoint=${MOMO_ENDPOINT:https://test-payment.momo.vn/v2/gateway/api/create}
payment.momo.refund-endpoint=${MOMO_REFUND_ENDPOINT:https://test-payment.momo.vn/v2/gateway/api/refund}
payment.momo.refund-query-endpoint=${MOMO_REFUND_QUERY_ENDPOINT:https://test-payment.momo.vn/v2/gateway/api/refund/query}
payment.momo.partner-code=${MOMO_PARTNER_CODE:CHANGE_ME}
payment.momo.access-key=${MOMO_ACCESS_KEY:CHANGE_ME}
payment.momo.secret-key=${MOMO_SECRET_KEY:CHANGE_ME}
payment.momo.redirect-url=${MOMO_REDIRECT_URL:http://localhost:5173/thanh-toan/ket-qua?provider=MOMO}
payment.momo.ipn-url=${MOMO_IPN_URL:http://localhost:8081/api/payments/momo/ipn}
payment.zalopay.endpoint=${ZALOPAY_ENDPOINT:https://sb-openapi.zalopay.vn/v2/create}
payment.zalopay.refund-endpoint=${ZALOPAY_REFUND_ENDPOINT:https://sb-openapi.zalopay.vn/v2/refund}
payment.zalopay.refund-query-endpoint=${ZALOPAY_REFUND_QUERY_ENDPOINT:https://sb-openapi.zalopay.vn/v2/query_refund}
payment.zalopay.app-id=${ZALOPAY_APP_ID:CHANGE_ME}
payment.zalopay.key1=${ZALOPAY_KEY1:CHANGE_ME}
payment.zalopay.key2=${ZALOPAY_KEY2:CHANGE_ME}
payment.zalopay.callback-url=${ZALOPAY_CALLBACK_URL:http://localhost:8081/api/payments/zalopay/callback}
payment.zalopay.redirect-url=${ZALOPAY_REDIRECT_URL:http://localhost:5173/thanh-toan/ket-qua?provider=ZALOPAY}
