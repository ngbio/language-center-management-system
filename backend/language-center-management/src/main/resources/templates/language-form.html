<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Thông tin ngôn ngữ</title>
    <th:block th:replace="base :: css"></th:block>
</head>
<body class="bg-light">
<div th:replace="base :: header"></div>

<section class="container py-4">
    <div class="card border-0 shadow-sm">
        <div class="card-body p-4">
            <h3 class="fw-bold mb-4" th:text="${language.id == null ? 'Thêm ngôn ngữ' : 'Cập nhật ngôn ngữ'}"></h3>

            <form th:action="@{/admin/languages/save}" th:object="${language}" method="post">
                <input type="hidden" th:field="*{id}" />

                <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger">
                    <div th:each="error : ${#fields.globalErrors()}" th:text="${error}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Mã ngôn ngữ</label>
                    <input type="text" class="form-control" th:field="*{languageCode}" maxlength="20" required />
                    <div class="text-danger small" th:errors="*{languageCode}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Tên ngôn ngữ</label>
                    <input type="text" class="form-control" th:field="*{languageName}" maxlength="100" required />
                    <div class="text-danger small" th:errors="*{languageName}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Mô tả</label>
                    <textarea class="form-control" th:field="*{description}" rows="3" maxlength="500"></textarea>
                    <div class="text-danger small" th:errors="*{description}"></div>
                </div>

                <div class="mb-4">
                    <label class="form-label">Trạng thái</label>
                    <select class="form-select" th:field="*{status}">
                        <option value="ACTIVE">ACTIVE</option>
                        <option value="INACTIVE">INACTIVE</option>
                    </select>
                    <div class="text-danger small" th:errors="*{status}"></div>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-success">Lưu</button>
                    <a class="btn btn-secondary" th:href="@{/admin/languages}">Quay lại</a>
                </div>
            </form>
        </div>
    </div>
</section>

<div th:replace="base :: footer"></div>
</body>
</html>
